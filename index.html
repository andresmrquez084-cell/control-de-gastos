<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control Financiero</title>
<meta name="theme-color" content="#171817">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f5f5f2;--card:#fff;--text:#171817;--muted:#777d78;--line:#e2e2dc;--dark:#171817;--green:#4e7158;--red:#9a5750}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.hidden{display:none!important}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--dark);color:#fff}.secondary{background:#ecece7;color:#222}
.auth{min-height:100vh;display:grid;place-items:center;padding:18px}.auth-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px}.logo{width:44px;height:44px;border-radius:13px;background:#171817;color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:16px}.auth-card h1{margin:0 0 6px;font-size:27px}.auth-card p{margin:0;color:var(--muted);font-size:13px}.form{display:grid;gap:12px;margin-top:20px}.field{display:grid;gap:6px}.field span{font-size:11px;font-weight:700;color:#656b66}.field input,.field select{min-height:44px;width:100%;border:1px solid #d9d9d3;border-radius:10px;background:#fbfbf8;padding:0 11px}.msg{font-size:12px;color:var(--muted);min-height:18px;margin-top:8px}
.shell{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{background:#171817;color:#fff;padding:22px 14px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 25px}.brand .logo{margin:0;background:#f4f0df;color:#171817;width:38px;height:38px}.brand strong{display:block}.brand small{color:#8d918e}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#a7aca8;text-align:left;padding:11px;border-radius:10px;cursor:pointer}.nav button.active{background:#292c2a;color:#fff}.main{padding:30px 34px 80px;min-width:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:28px}.top small{display:block;text-transform:uppercase;letter-spacing:.12em;color:#878c87;font-weight:800;margin-bottom:5px}.actions{display:flex;gap:8px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px}.card{padding:16px}.card span{font-size:11px;color:var(--muted)}.card b{display:block;font-size:21px;margin:7px 0}.dark{background:#1e211f;color:#fff;border-color:#1e211f}.dark span{color:#a5aaa6}.panel{padding:18px;margin-bottom:12px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.panel h2{font-size:16px;margin:0}.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid #ecece7}.row:first-child{border-top:0}.row b{font-size:13px}.row small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.amount{font-weight:800;font-size:13px}.green{color:var(--green)}.red{color:var(--red)}.del{border:0;background:transparent;color:#999;cursor:pointer}.empty{border:1px dashed #d4d4cd;border-radius:12px;padding:24px;text-align:center;color:var(--muted);font-size:12px}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.entity{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #ecece7}.entity:first-child{border-top:0}.entity small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.receipts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.receipt{border:1px solid var(--line);border-radius:12px;overflow:hidden}.receipt img{width:100%;aspect-ratio:4/3;object-fit:cover}.receipt div{padding:9px}.receipt small{color:var(--muted)}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;padding:15px;z-index:20}.modal{width:min(520px,100%);max-height:calc(100vh - 30px);overflow:auto;background:#fff;border-radius:17px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eee;border-radius:9px;width:38px;height:38px}.mobile-nav{display:none}.notice{padding:12px;border-radius:10px;background:#f0f0eb;color:#666;font-size:12px;margin-bottom:12px}
@media(max-width:860px){.shell{grid-template-columns:74px 1fr}.brand div:last-child,.nav button span{display:none}.brand{justify-content:center}.nav button{text-align:center}.main{padding:24px 18px 80px}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:600px){.shell{display:block}.side{display:none}.main{padding:18px 12px 78px}.top h1{font-size:23px}.actions .secondary{display:none}.cards{gap:7px}.card{padding:13px}.card b{font-size:17px}.receipts{grid-template-columns:1fr}.mobile-nav{display:grid;position:fixed;left:0;right:0;bottom:0;grid-template-columns:repeat(6,1fr);background:#171817;padding:6px;z-index:10}.mobile-nav button{background:transparent;border:0;color:#8e938f;font-size:9px;padding:9px 2px}.mobile-nav button.active{color:#fff}}
</style>
</head>
<body>
<div id="auth" class="auth">
  <section class="auth-card">
    <div class="logo">$</div>
    <h1>Control Financiero</h1>
    <p>Ingresos, gastos, activos, pasivos y comprobantes sincronizados.</p>
    <form id="authForm" class="form">
      <label class="field"><span>Email</span><input id="email" type="email" required autocomplete="email"></label>
      <label class="field"><span>Contraseña</span><input id="password" type="password" required minlength="6" autocomplete="current-password"></label>
      <button class="btn primary" type="submit">Ingresar</button>
      <button class="btn secondary" id="signup" type="button">Crear cuenta</button>
    </form>
    <div id="authMsg" class="msg"></div>
  </section>
</div>
<div id="app" class="shell hidden">
  <aside class="side">
    <div class="brand"><div class="logo">$</div><div><strong>Finanzas</strong><small>Control personal</small></div></div>
    <div class="nav" id="nav"></div>
  </aside>
  <main class="main">
    <header class="top">
      <div><small>Control financiero</small><h1 id="title">Resumen</h1></div>
      <div class="actions"><button class="btn secondary" id="logout">Salir</button><button class="btn primary" id="newMove">+ Movimiento</button></div>
    </header>
    <div id="view"></div>
  </main>
</div>
<div class="mobile-nav hidden" id="mobileNav"></div>
<div id="modal"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm';
const supabase=createClient('https://dnlgvtpvooaqvxnobmho.supabase.co','sb_publishable_kOJVN9fAThZ5Nw-p-9KtPg_bi6t-Tkx');
const qs=s=>document.querySelector(s);
const tabs=[['dashboard','Resumen'],['movements','Movimientos'],['liabilities','Pasivos'],['assets','Activos'],['accounts','Cuentas'],['receipts','Comprobantes']];
let user=null,tab='dashboard',state={accounts:[],transactions:[],liabilities:[],assets:[],receipts:[]};
const money=(n,c='UYU')=>new Intl.NumberFormat('es-UY',{style:'currency',currency:c,maximumFractionDigits:2}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setAuth(on){qs('#auth').classList.toggle('hidden',!on);qs('#app').classList.toggle('hidden',on);qs('#mobileNav').classList.toggle('hidden',on)}
async function load(){
 const res=await Promise.all([
  supabase.from('accounts').select('*').order('created_at'),
  supabase.from('transactions').select('*').order('transaction_date',{ascending:false}).order('created_at',{ascending:false}),
  supabase.from('liabilities').select('*').order('created_at',{ascending:false}),
  supabase.from('assets').select('*').order('created_at',{ascending:false}),
  supabase.from('receipts').select('*').order('created_at',{ascending:false})
 ]);
 const err=res.find(x=>x.error);if(err){alert(err.error.message);return}
 state.accounts=res[0].data||[];state.transactions=res[1].data||[];state.liabilities=res[2].data||[];state.assets=res[3].data||[];state.receipts=res[4].data||[];
 if(!state.accounts.length){await supabase.from('accounts').insert([{user_id:user.id,name:'Efectivo',type:'cash',currency:'UYU',initial_balance:0},{user_id:user.id,name:'Cuenta bancaria',type:'bank',currency:'UYU',initial_balance:0}]);return load()}
 for(const r of state.receipts){const x=await supabase.storage.from('receipts').createSignedUrl(r.storage_path,3600);r.image=x.data?.signedUrl||''}
 render();
}
function metrics(){
 const now=new Date(),ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
 const tx=state.transactions.filter(x=>x.transaction_date&&x.transaction_date.startsWith(ym));
 const income=tx.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0);
 const expenses=tx.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0);
 const accounts=state.accounts.map(a=>Object.assign({},a,{balance:Number(a.initial_balance||0)+state.transactions.filter(t=>t.account_id===a.id).reduce((s,t)=>s+(t.type==='income'?Number(t.amount||0):t.type==='expense'?-Number(t.amount||0):0),0)}));
 const cash=accounts.reduce((s,a)=>s+a.balance,0);
 const assets=cash+state.assets.reduce((s,a)=>s+Number(a.value||0),0);
 const liabilities=state.liabilities.reduce((s,a)=>s+Number(a.remaining_amount||0),0);
 return{income,expenses,flow:income-expenses,accounts,cash,assets,liabilities,net:assets-liabilities};
}
function nav(){
 const h=tabs.map(x=>'<button data-tab="'+x[0]+'" class="'+(tab===x[0]?'active':'')+'"><span>'+x[1]+'</span></button>').join('');
 qs('#nav').innerHTML=h;qs('#mobileNav').innerHTML=h;
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
}
function txRows(items){
 if(!items.length)return '<div class="empty">No hay movimientos todavía.</div>';
 return items.map(t=>{const a=state.accounts.find(x=>x.id===t.account_id);return '<div class="row"><div><b>'+esc(t.description)+'</b><small>'+esc(t.category||'Sin categoría')+' · '+esc(a?.name||'Sin cuenta')+' · '+esc(t.transaction_date)+'</small></div><div class="amount '+(t.type==='income'?'green':'red')+'">'+(t.type==='income'?'+ ':'− ')+money(t.amount,t.currency)+'</div><button class="del" data-del="transactions" data-id="'+t.id+'">✕</button></div>'}).join('');
}
function entityRows(kind){
 const arr=state[kind];if(!arr.length)return '<div class="empty">Todavía no hay registros.</div>';
 if(kind==='liabilities')return arr.map(x=>'<div class="entity"><div><b>'+esc(x.name)+'</b><small>'+(x.installment_amount?'Cuota '+money(x.installment_amount,x.currency):'Sin cuota registrada')+'</small></div><b>'+money(x.remaining_amount,x.currency)+'</b><button class="del" data-del="liabilities" data-id="'+x.id+'">✕</button></div>').join('');
 return arr.map(x=>'<div class="entity"><div><b>'+esc(x.name)+'</b><small>'+esc(x.category||'Sin categoría')+'</small></div><b>'+money(x.value,x.currency)+'</b><button class="del" data-del="assets" data-id="'+x.id+'">✕</button></div>').join('');
}
function bind(){
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar este registro?'))return;const e=await supabase.from(b.dataset.del).delete().eq('id',b.dataset.id);if(e.error)alert(e.error.message);else load()});
 document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openModal(b.dataset.add));
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});
 const u=qs('#uploadReceipt');if(u){u.onclick=()=>qs('#file').click();qs('#file').onchange=uploadReceipt}
}
function render(){
 nav();const m=metrics();qs('#title').textContent=tabs.find(x=>x[0]===tab)[1];let h='';
 if(tab==='dashboard')h='<div class="cards"><div class="card"><span>Disponible</span><b>'+money(m.cash)+'</b></div><div class="card"><span>Ingresos mes</span><b>'+money(m.income)+'</b></div><div class="card"><span>Gastos mes</span><b>'+money(m.expenses)+'</b></div><div class="card dark"><span>Patrimonio neto</span><b>'+money(m.net)+'</b></div></div><div class="grid2"><section class="panel"><div class="panel-head"><h2>Flujo mensual</h2><b class="'+(m.flow>=0?'green':'red')+'">'+money(m.flow)+'</b></div><div class="entity"><span>Ingresos</span><b>'+money(m.income)+'</b></div><div class="entity"><span>Gastos</span><b>'+money(m.expenses)+'</b></div></section><section class="panel"><div class="panel-head"><h2>Patrimonio</h2></div><div class="entity"><span>Activos</span><b>'+money(m.assets)+'</b></div><div class="entity"><span>Pasivos</span><b>'+money(m.liabilities)+'</b></div></section></div><section class="panel"><div class="panel-head"><h2>Últimos movimientos</h2><button class="btn secondary" data-go="movements">Ver todos</button></div>'+txRows(state.transactions.slice(0,6))+'</section>';
 if(tab==='movements')h='<section class="panel"><div class="panel-head"><h2>Movimientos</h2><button class="btn secondary" data-add="transaction">+ Agregar</button></div>'+txRows(state.transactions)+'</section>';
 if(tab==='liabilities')h='<section class="panel"><div class="panel-head"><h2>Pasivos</h2><button class="btn secondary" data-add="liability">+ Agregar</button></div>'+entityRows('liabilities')+'</section>';
 if(tab==='assets')h='<section class="panel"><div class="panel-head"><h2>Activos</h2><button class="btn secondary" data-add="asset">+ Agregar</button></div>'+entityRows('assets')+'</section>';
 if(tab==='accounts')h='<section class="panel"><div class="panel-head"><h2>Cuentas</h2><button class="btn secondary" data-add="account">+ Agregar</button></div>'+m.accounts.map(a=>'<div class="entity"><div><b>'+esc(a.name)+'</b><small>'+esc(a.type)+' · '+esc(a.currency)+'</small></div><b>'+money(a.balance,a.currency)+'</b><button class="del" data-del="accounts" data-id="'+a.id+'">✕</button></div>').join('')+'</section>';
 if(tab==='receipts')h='<section class="panel"><div class="panel-head"><h2>Comprobantes</h2><button class="btn secondary" id="uploadReceipt">📷 Subir foto</button><input id="file" type="file" accept="image/*" capture="environment" class="hidden"></div><div class="notice">Las fotos se guardan en un bucket privado de Supabase.</div>'+(state.receipts.length?'<div class="receipts">'+state.receipts.map(r=>'<div class="receipt">'+(r.image?'<img src="'+r.image+'" alt="Comprobante">':'')+'<div><b>Comprobante</b><br><small>'+new Date(r.created_at).toLocaleDateString('es-UY')+'</small></div></div>').join('')+'</div>':'<div class="empty">No hay comprobantes cargados.</div>')+'</section>';
 qs('#view').innerHTML=h;bind();
}
function field(label,html){return '<label class="field"><span>'+label+'</span>'+html+'</label>'}
function openModal(type){
 let title='',body='';
 if(type==='transaction'){title='Nuevo movimiento';body=field('Tipo','<select name="type"><option value="expense">Gasto</option><option value="income">Ingreso</option></select>')+field('Descripción','<input name="description" required>')+field('Monto','<input name="amount" type="number" min="0.01" step="0.01" required>')+field('Moneda','<select name="currency"><option>UYU</option><option>USD</option></select>')+field('Fecha','<input name="date" type="date" required value="'+new Date().toISOString().slice(0,10)+'">')+field('Categoría','<input name="category" placeholder="Comida, transporte, etc.">')+field('Cuenta','<select name="account">'+state.accounts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('')+'</select>')}
 if(type==='liability'){title='Nuevo pasivo';body=field('Nombre','<input name="name" required>')+field('Monto original','<input name="original" type="number" min="0" step="0.01" required>')+field('Saldo pendiente','<input name="remaining" type="number" min="0" step="0.01" required>')+field('Cuota mensual','<input name="installment" type="number" min="0" step="0.01>')+field('Moneda','<select name="currency"><option>UYU</option><option>USD</option></select>')}
 if(type==='asset'){title='Nuevo activo';body=field('Nombre','<input name="name" required>')+field('Valor','<input name="value" type="number" min="0" step="0.01" required>')+field('Categoría','<input name="category">')+field('Moneda','<select name="currency"><option>UYU</option><option>USD</option></select>')}
 if(type==='account'){title='Nueva cuenta';body=field('Nombre','<input name="name" required>')+field('Tipo','<select name="type"><option value="bank">Banco</option><option value="wallet">Wallet</option><option value="card">Tarjeta</option><option value="cash">Efectivo</option><option value="other">Otra</option></select>')+field('Saldo inicial','<input name="initial" type="number" step="0.01" value="0">')+field('Moneda','<select name="currency"><option>UYU</option><option>USD</option></select>')}
 qs('#modal').innerHTML='<div class="drawer"><div class="modal"><div class="modal-head"><h2>'+title+'</h2><button id="close" class="close">✕</button></div><form id="dataForm" class="form">'+body+'<button class="btn primary" type="submit">Guardar</button></form></div></div>';
 qs('#close').onclick=()=>qs('#modal').innerHTML='';
 qs('#dataForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);let table,p;
  if(type==='transaction'){table='transactions';p={user_id:user.id,type:f.get('type'),description:f.get('description'),amount:Number(f.get('amount')),currency:f.get('currency'),transaction_date:f.get('date'),category:f.get('category'),account_id:f.get('account'),source:'manual'}}
  if(type==='liability'){table='liabilities';p={user_id:user.id,name:f.get('name'),original_amount:Number(f.get('original')),remaining_amount:Number(f.get('remaining')),installment_amount:Number(f.get('installment')||0)||null,currency:f.get('currency')}}
  if(type==='asset'){table='assets';p={user_id:user.id,name:f.get('name'),value:Number(f.get('value')),category:f.get('category'),currency:f.get('currency')}}
  if(type==='account'){table='accounts';p={user_id:user.id,name:f.get('name'),type:f.get('type'),initial_balance:Number(f.get('initial')||0),currency:f.get('currency')}}
  const x=await supabase.from(table).insert(p);if(x.error)alert(x.error.message);else{qs('#modal').innerHTML='';load()}
 };
}
async function uploadReceipt(e){
 const file=e.target.files[0];if(!file)return;
 const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'');
 const path=user.id+'/'+crypto.randomUUID()+'.'+ext;
 const u=await supabase.storage.from('receipts').upload(path,file,{contentType:file.type,upsert:false});if(u.error){alert(u.error.message);return}
 const x=await supabase.from('receipts').insert({user_id:user.id,storage_path:path});if(x.error)alert(x.error.message);else load();
}
qs('#authForm').onsubmit=async e=>{e.preventDefault();qs('#authMsg').textContent='Ingresando...';const x=await supabase.auth.signInWithPassword({email:qs('#email').value.trim(),password:qs('#password').value});qs('#authMsg').textContent=x.error?x.error.message:''};
qs('#signup').onclick=async()=>{const email=qs('#email').value.trim(),password=qs('#password').value;if(!email||password.length<6){qs('#authMsg').textContent='Ingresá email y contraseña de al menos 6 caracteres.';return}const x=await supabase.auth.signUp({email,password});qs('#authMsg').textContent=x.error?x.error.message:(x.data.session?'Cuenta creada.':'Cuenta creada. Revisá tu email para confirmar.')};
qs('#logout').onclick=()=>supabase.auth.signOut();qs('#newMove').onclick=()=>openModal('transaction');
supabase.auth.onAuthStateChange(async(_e,s)=>{user=s?.user||null;setAuth(!user);if(user)await load()});
const current=await supabase.auth.getSession();user=current.data.session?.user||null;setAuth(!user);if(user)await load();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));
</script>
</body>
</html>
